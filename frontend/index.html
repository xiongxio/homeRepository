<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>面试练习助手</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4f4f5;
      }

      #boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        color: #18181b;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      .boot-card {
        width: min(420px, 100%);
        padding: 28px 24px;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(24, 24, 27, 0.08);
        text-align: center;
      }

      .boot-spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 16px;
        border: 3px solid #d4d4d8;
        border-top-color: #059669;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-card h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      .boot-card p {
        margin: 10px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: #52525b;
      }

      .boot-card .boot-hint {
        font-size: 12px;
        color: #a1a1aa;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-spinner" aria-hidden="true"></div>
        <h1>面试练习助手</h1>
        <p>正在启动界面…</p>
        <p id="boot-hint" class="boot-hint">
          首次启动或刚更新依赖时，前端需要编译资源，通常几秒内完成。
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var hint = document.getElementById("boot-hint");
        if (hint) {
          hint.textContent =
            "仍在启动。请查看启动脚本窗口，确认前端服务已经就绪。";
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
